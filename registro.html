<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta - Marvel</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="barra-auth">
    <div class="logo">MARVEL</div>
    <div class="titulo-centro">JAC MARVEL</div>
    <div class="enlaces"><a href="index.html">Home</a><a href="#">Contact Us</a></div>
  </div>

  <div class="registro">
    <div class="izquierda">
      <form class="caja-auth" id="formRegistro">
        <h2>Crear cuenta</h2>
        <label>Nombre <input type="text" id="nombre" required></label>
        <label>Correo <input type="email" id="correo" required></label>
        <label>Contraseña (mínimo 4 caracteres) <input type="password" id="clave" minlength="4" required></label>
        <button class="boton-rojo" type="submit">Registrarme</button>
        <div class="enlaces-caja">¿Ya tienes cuenta? <a href="index.html" style="display:inline; color:#c40000;">Inicia sesión</a></div>
      </form>
    </div>
    <div class="derecha" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('img/fondo_marvel.jpg');"></div>
  </div>

  <script src="js/comun.js"></script>
  <script>
    document.getElementById("formRegistro").addEventListener("submit", function (evento) {
      evento.preventDefault();
      const nombre = document.getElementById("nombre").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const clave = document.getElementById("clave").value;

      // Revisamos que el correo no esté usado
      const usuarios = leer("usuarios", {});
      let esAdministrador = false;
      for (let i = 0; i < administradores.length; i++) {
        if (administradores[i].correo === correo) {
          esAdministrador = true;
        }
      }
      if (usuarios[correo] || esAdministrador) {
        alert("Ese correo ya está registrado");
        return;
      }

      // Guardamos el usuario nuevo
      usuarios[correo] = { nombre: nombre, correo: correo, clave: clave };
      guardar("usuarios", usuarios);
      alert("Cuenta creada correctamente");
      location.href = "index.html";
    });
  </script>
</body>
</html>
